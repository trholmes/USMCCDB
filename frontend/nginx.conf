# Scheme the client actually used: behind the TLS proxy (caddy) the incoming
# X-Forwarded-Proto is "https" and must be passed through, not clobbered with
# $scheme (always "http" here — nginx listens on plain port 80). Without it
# the backend issues the session cookie without the Secure flag. Falls back
# to $scheme for plain-HTTP deployments where nginx is the outermost server.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + interactive docs go to the FastAPI container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # React SPA: serve files, fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
